<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Декан - Виртуальный деканат</title>
    <link rel="stylesheet" href="style.css">
    <script src="toast.js"></script>
</head>
<body>
<div class="header">
    <div class="container">
        <h2>🎓 Виртуальный деканат - Декан</h2>
        <div class="user-info">
            <span id="user-login"></span>
            <span class="role-badge" id="user-role"></span>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="card">
        <div class="section">
            <h3>👤 Мой профиль</h3>
            <div id="profile-info"></div>
            <button class="btn-manage" onclick="openDataModal()">⚙️ Управление данными</button>
        </div>
    </div>

    <div class="card">
        <div class="section">
            <h3>📋 Заявления на поступление</h3>
            <div id="applications-list"></div>
        </div>
    </div>

    <div class="card">
        <div class="section">
            <h3>👥 Управление студентами</h3>
            <div id="students-list"></div>
        </div>
    </div>
</div>

<!-- Модальное окно -->
<div id="dataModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>⚙️ Управление данными</h3>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('profile-tab')">📝 Профиль</button>
            <button class="tab-btn" onclick="switchTab('password-tab')">🔐 Пароль</button>
            <button class="tab-btn" onclick="switchTab('security-tab')">❓ Секретный вопрос</button>
        </div>
        <div id="profile-tab" class="tab-content active">
            <div class="form-group"><label>Email:</label><input type="email" id="editEmail" placeholder="Email"></div>
            <div class="form-group"><label>Телефон:</label><input type="text" id="editPhone" placeholder="Телефон"></div>
            <button class="btn-save" onclick="updateProfile()">💾 Сохранить изменения</button>
        </div>
        <div id="password-tab" class="tab-content">
            <div class="form-group"><label>Старый пароль:</label><input type="password" id="oldPassword" placeholder="Старый пароль"></div>
            <div class="form-group"><label>Новый пароль:</label><input type="password" id="newPassword" placeholder="Новый пароль"></div>
            <div class="form-group"><label>Подтверждение пароля:</label><input type="password" id="confirmPassword" placeholder="Подтвердите новый пароль"></div>
            <button class="btn-save" onclick="changePassword()">🔑 Сменить пароль</button>
        </div>
        <div id="security-tab" class="tab-content">
            <div class="form-group"><label>Секретный вопрос:</label><input type="text" id="securityQuestion" placeholder="Ваш секретный вопрос"></div>
            <div class="form-group"><label>Ответ:</label><input type="text" id="securityAnswer" placeholder="Ответ"></div>
            <button class="btn-save" onclick="updateSecurityQuestion()">❓ Сохранить вопрос</button>
        </div>
    </div>
</div>

<script>
    let token = localStorage.getItem('token');
    if (!token) window.location.href = 'index.html';

    const payload = JSON.parse(atob(token.split('.')[1]));
    document.getElementById('user-login').innerText = payload.userId || 'User';
    document.getElementById('user-role').innerText = payload.role || 'DEAN';

    function showSuccess(msg) { showToast(msg, 'success'); }
    function showError(msg) { showToast(msg, 'error'); }

    async function loadData() {
        try {
            const appsRes = await fetch('/dean/applications', { headers: { 'Authorization': 'Bearer ' + token } });
            const applications = await appsRes.json();
            let appsHtml = '<table class="data-table"><thead><tr><th>ID</th><th>Абитуриент</th><th>Программа</th><th>Статус</th><th>Действие</th></tr></thead><tbody>';
            if (applications && applications.length > 0) {
                applications.forEach(app => {
                    appsHtml += `<tr>
                        <td>${app.id}</td>
                        <td>${app.applicantId}</td>
                        <td>${app.programId}</td>
                        <td>${app.status}</td>
                        <td><button class="btn btn-success btn-sm" onclick="approveApp(${app.id})">Одобрить</button></td>
                    </tr>`;
                });
            } else {
                appsHtml += '<tr><td colspan="5">Нет заявлений</td></tr>';
            }
            appsHtml += '</tbody></tr>';
            document.getElementById('applications-list').innerHTML = appsHtml;

            const studentsRes = await fetch('/dean/students', { headers: { 'Authorization': 'Bearer ' + token } });
            const students = await studentsRes.json();
            let studentsHtml = '<table class="data-table"><thead><tr><th>ID</th><th>ФИО</th><th>Группа</th><th>Статус</th><th>Действия</th></tr></thead><tbody>';
            if (students && students.length > 0) {
                students.forEach(s => {
                    studentsHtml += `<tr>
                        <td>${s.id}</td>
                        <td>${s.fullName || '—'}</td>
                        <td><input type="number" id="group-${s.id}" value="${s.groupId}" style="width:60px"></td>
                        <td>${s.status || '—'}</td>
                        <td><button class="btn btn-warning btn-sm" onclick="transferStudent(${s.id})">Перевести</button>
                            <button class="btn btn-danger btn-sm" onclick="expelStudent(${s.id})">Отчислить</button></td>
                    </tr>`;
                });
            } else {
                studentsHtml += '<tr><td colspan="5">Нет студентов</td></tr>';
            }
            studentsHtml += '</tbody></table>';
            document.getElementById('students-list').innerHTML = studentsHtml;
        } catch(err) { showError('Ошибка загрузки данных'); }
    }

    async function approveApp(appId) {
        try {
            await fetch(`/dean/approve-application/${appId}`, { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
            showSuccess('✅ Заявление одобрено!');
            loadData();
        } catch(err) { showError('❌ Ошибка при одобрении'); }
    }

    async function transferStudent(studentId) {
        const groupId = document.getElementById(`group-${studentId}`).value;
        try {
            await fetch(`/dean/transfer-student/${studentId}/to-group/${groupId}`, { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
            showSuccess('✅ Студент переведён!');
            loadData();
        } catch(err) { showError('❌ Ошибка при переводе'); }
    }

    async function expelStudent(studentId) {
        if (!confirm('Отчислить студента?')) return;
        try {
            await fetch(`/dean/expel-student/${studentId}`, { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
            showSuccess('✅ Студент отчислен!');
            loadData();
        } catch(err) { showError('❌ Ошибка при отчислении'); }
    }

    function openDataModal() { document.getElementById('dataModal').style.display = 'block'; }
    function closeModal() { document.getElementById('dataModal').style.display = 'none'; }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
    }

    async function updateProfile() {
        const email = document.getElementById('editEmail').value;
        const phone = document.getElementById('editPhone').value;

        try {
            const res = await fetch('/dean/update-profile', {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, phone })
            });
            if (!res.ok) {
                const error = await res.json();
                throw new Error(error.message || 'Ошибка');
            }
            showSuccess('✅ Профиль обновлён!');
            closeModal();
        } catch(err) { showError('❌ ' + err.message); }
    }

    async function changePassword() {
        const oldPassword = document.getElementById('oldPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        if (newPassword !== confirmPassword) { showError('❌ Пароли не совпадают'); return; }

        try {
            const res = await fetch('/dean/change-password', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ oldPassword, newPassword })
            });
            if (!res.ok) {
                const error = await res.json();
                throw new Error(error.message || 'Ошибка');
            }
            showSuccess('✅ Пароль изменён!');
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        } catch(err) { showError('❌ ' + err.message); }
    }

    async function updateSecurityQuestion() {
        const question = document.getElementById('securityQuestion').value;
        const answer = document.getElementById('securityAnswer').value;
        if (!question || !answer) { showError('❌ Заполните вопрос и ответ'); return; }

        try {
            const res = await fetch('/dean/security-question', {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ question, answer })
            });
            if (!res.ok) {
                const error = await res.json();
                throw new Error(error.message || 'Ошибка');
            }
            showSuccess('✅ Секретный вопрос обновлён!');
        } catch(err) { showError('❌ ' + err.message); }
    }

    function logout() { localStorage.removeItem('token'); window.location.href = 'index.html'; }

    window.onclick = function(event) { if (event.target == document.getElementById('dataModal')) closeModal(); }

    loadData();
</script>
</body>
</html>
