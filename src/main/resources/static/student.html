<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Студент - Виртуальный деканат</title>
    <link rel="stylesheet" href="style.css">
    <script src="toast.js"></script>
    <script src="app.js"></script>
</head>
<body>
<div class="header">
    <div class="container">
        <h2>🎓 Виртуальный деканат - Студент</h2>
        <div class="user-info">
            <span id="user-login"></span>
            <span class="role-badge" id="user-role"></span>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="card">
        <div class="section">
            <h3>👤 Мой профиль</h3>
            <div id="profile" class="profile-info"></div>
            <button class="btn-manage" onclick="openStudentDataModal()">⚙️ Управление данными</button>
        </div>
    </div>

    <div class="card">
        <div class="section">
            <h3>👥 Студенты моей группы</h3>
            <div id="group-students"></div>
        </div>
    </div>

    <div class="card">
        <div class="section">
            <h3>📚 Мои дисциплины</h3>
            <div class="form-group">
                <label for="courseSearch">🔍 Поиск по дисциплине:</label>
                <input type="text" id="courseSearch" placeholder="Введите название дисциплины или преподавателя...">
            </div>
            <div id="my-courses"></div>
        </div>
    </div>

    <div class="card">
        <div class="section">
            <h3>📜 История переводов</h3>
            <div id="transfers-list"></div>
        </div>
    </div>

    <div class="card">
        <div class="section">
            <h3>📊 Моя успеваемость</h3>
            <div id="grades-list"></div>
        </div>
    </div>
</div>

<!-- Модальное окно -->
<div id="studentDataModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>⚙️ Управление данными</h3>
            <span class="close" onclick="closeStudentModal()">&times;</span>
        </div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchStudentTab('profile-tab')">📝 Профиль</button>
            <button class="tab-btn" onclick="switchStudentTab('password-tab')">🔐 Пароль</button>
            <button class="tab-btn" onclick="switchStudentTab('security-tab')">❓ Секретный вопрос</button>
        </div>

        <div id="profile-tab" class="tab-content active">
            <div class="form-group">
                <label for="editFullName">ФИО:</label>
                <input type="text" id="editFullName" placeholder="ФИО">
            </div>
            <div class="form-group">
                <label for="editEmail">Email:</label>
                <input type="email" id="editEmail" placeholder="Email">
            </div>
            <div class="form-group">
                <label for="editPhone">Телефон:</label>
                <input type="text" id="editPhone" placeholder="Телефон">
            </div>
            <button class="btn-save" onclick="updateStudentProfile()">💾 Сохранить изменения</button>
        </div>

        <div id="password-tab" class="tab-content">
            <div class="form-group">
                <label for="oldPassword">Старый пароль:</label>
                <input type="password" id="oldPassword" placeholder="Введите старый пароль">
            </div>
            <div class="form-group">
                <label for="newPassword">Новый пароль:</label>
                <input type="password" id="newPassword" placeholder="Введите новый пароль">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Подтверждение пароля:</label>
                <input type="password" id="confirmPassword" placeholder="Подтвердите новый пароль">
            </div>
            <button class="btn-save" onclick="changeStudentPassword()">🔑 Сменить пароль</button>
        </div>

        <div id="security-tab" class="tab-content">
            <div class="form-group">
                <label for="securityQuestion">Секретный вопрос:</label>
                <input type="text" id="securityQuestion" placeholder="Например: Ваша любимая книга?">
            </div>
            <div class="form-group">
                <label for="securityAnswer">Ответ:</label>
                <input type="text" id="securityAnswer" placeholder="Ответ на вопрос">
            </div>
            <button class="btn-save" onclick="updateStudentSecurityQuestion()">❓ Сохранить вопрос</button>
        </div>
    </div>
</div>

<script>
    // Проверка токена
    if (!localStorage.getItem('token')) {
        window.location.href = 'index.html';
    }

    try {
        const payload = JSON.parse(atob(localStorage.getItem('token').split('.')[1]));
        document.getElementById('user-login').innerText = payload.userId || 'User';
        document.getElementById('user-role').innerText = payload.role || 'STUDENT';
    } catch(e) {
        console.error('Invalid token');
    }

    // Загружаем все данные
    loadStudentProfile();
    loadStudentGroup();
    loadStudentCourses();
    loadStudentTransfers();
    loadStudentGrades();
</script>
</body>
</html>
